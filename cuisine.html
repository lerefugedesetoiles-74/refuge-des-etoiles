<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cuisine - Le Refuge des Étoiles</title>

<style>

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f2ed;
  color: #2f2f2f;
}

header {
  background: linear-gradient(135deg, #7a5942, #b69273);
  color: white;
  text-align: center;
  padding: 35px 20px;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

header p {
  max-width: 650px;
  margin: 12px auto 0;
  line-height: 1.5;
}

.language-selector {
  margin-top: 18px;
}

.language-selector button {
  border: none;
  background: white;
  padding: 9px 12px;
  margin: 3px;
  border-radius: 8px;
  font-size: 18px;
  cursor: pointer;
}

.container {
  max-width: 850px;
  margin: auto;
  padding: 20px;
}

.intro {
  background: white;
  border-radius: 15px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.07);
  line-height: 1.6;
}

.appliance {
  background: white;
  border-radius: 16px;
  margin-bottom: 15px;
  overflow: hidden;
  box-shadow: 0 3px 10px rgba(0,0,0,0.07);
}

.appliance-header {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 18px;
  cursor: pointer;
}

.appliance-header:hover {
  background: #faf8f5;
}

.icon {
  min-width: 58px;
  height: 58px;
  border-radius: 50%;
  background: #f3ebe4;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
}

.appliance-info {
  flex: 1;
}

.appliance-info h2 {
  color: #7a5942;
  margin: 0 0 5px;
  font-size: 20px;
}

.reference {
  color: #777;
  font-size: 14px;
}

.arrow {
  font-size: 20px;
  color: #7a5942;
  transition: transform 0.25s;
}

.appliance.open .arrow {
  transform: rotate(180deg);
}

.instructions {
  display: none;
  padding: 0 20px 20px 93px;
  line-height: 1.6;
  color: #555;
}

.appliance.open .instructions {
  display: block;
}

.instructions p {
  margin: 7px 0;
}

.notice {
  margin-top: 12px;
  padding: 12px;
  background: #f7f2ed;
  border-radius: 10px;
}

.back-button {
  display: block;
  width: fit-content;
  margin: 25px auto;
  padding: 13px 20px;
  background: #7a5942;
  color: white;
  text-decoration: none;
  border-radius: 10px;
  font-weight: bold;
}

footer {
  text-align: center;
  padding: 25px 20px;
  color: #777;
  font-size: 14px;
}

@media(max-width:600px) {

  .container {
    padding: 12px;
  }

  .instructions {
    padding: 0 18px 18px 18px;
  }

}

</style>
</head>

<body>

<header>

<h1>🍽️ <span id="pageTitle">Cuisine</span></h1>

<p id="headerText">
Retrouvez ici les informations utiles pour utiliser les équipements de la cuisine.
</p>

<div class="language-selector">
  <button onclick="changeLanguage('fr')">🇫🇷</button>
  <button onclick="changeLanguage('en')">🇬🇧</button>
  <button onclick="changeLanguage('de')">🇩🇪</button>
  <button onclick="changeLanguage('nl')">🇳🇱</button>
</div>

</header>

<div class="container">

<div class="intro" id="intro">
Sélectionnez un appareil pour afficher ses principales consignes d'utilisation.
</div>

<div id="appliances"></div>

<a href="index.html"
   class="back-button"
   id="homeButton">
← Retour au livret d'accueil
</a>

</div>

<footer>
✨ Le Refuge des Étoiles ✨<br>
Le Sappey — Haute-Savoie
</footer>

<script>

/* ============================
   APPAREILS
============================ */

const appliances = [

{
 icon:"☕",
 name:"Senseo",
 reference:"Philips Senseo HD7806/51",
 type:"coffee"
},

{
 icon:"📡",
 name:"Micro-ondes",
 reference:"Signature MO020-SM",
 type:"microwave"
},

{
 icon:"🧊",
 name:"Réfrigérateur",
 reference:"Whirlpool ART 961/H/SILVER",
 type:"fridge"
},

{
 icon:"🫖",
 name:"Bouilloire électrique",
 reference:"",
 type:"kettle"
},

{
 icon:"🔥",
 name:"Four multifonction",
 reference:"Electrolux EZC2400BCX",
 type:"oven"
},

{
 icon:"🍽️",
 name:"Lave-vaisselle",
 reference:"Référence à venir",
 type:"dishwasher"
},

{
 icon:"🔥",
 name:"Plaque de cuisson",
 reference:"4 feux gaz",
 type:"gas"
},

{
 icon:"🍞",
 name:"Grille-pain",
 reference:"Signature GR8211",
 type:"toaster"
}

];


/* ============================
   TRADUCTIONS
============================ */

const translations = {

fr: {

pageTitle:"Cuisine",

headerText:
"Retrouvez ici les informations utiles pour utiliser les équipements de la cuisine.",

intro:
"👆 Sélectionnez un appareil pour afficher ses principales consignes d'utilisation.",

home:
"← Retour au livret d'accueil",

open:
"Voir les consignes",

coffee:{
 name:"Cafetière Senseo",
 text:`
<p>☕ Utilisez des dosettes souples compatibles Senseo.</p>
<p>💧 Vérifiez que le réservoir contient suffisamment d'eau.</p>
<p>🔘 Placez la dosette dans le porte-dosette puis sélectionnez votre café.</p>
<p>🧹 Après utilisation, retirez la dosette usagée et laissez l'appareil propre.</p>
`
},

microwave:{
 name:"Four micro-ondes",
 text:`
<p>📡 Utilisez uniquement des récipients compatibles avec le micro-ondes.</p>
<p>⚠️ Ne placez jamais de métal, d'aluminium ou de vaisselle avec décor métallique à l'intérieur.</p>
<p>🧽 Merci de nettoyer les éventuelles projections après utilisation.</p>
`
},

fridge:{
 name:"Réfrigérateur",
 text:`
<p>🧊 Le réfrigérateur est à votre disposition pendant votre séjour.</p>
<p>🚪 Évitez de laisser la porte ouverte inutilement.</p>
<p>🧹 Avant votre départ, pensez à récupérer vos aliments et boissons.</p>
`
},

kettle:{
 name:"Bouilloire électrique",
 text:`
<p>💧 Remplissez uniquement avec de l'eau.</p>
<p>⚠️ Ne dépassez pas le niveau maximum indiqué.</p>
<p>🔥 Attention à la vapeur et à l'eau chaude lors du service.</p>
`
},

oven:{
 name:"Four multifonction",
 text:`
<p>🔥 Plusieurs modes de cuisson sont disponibles selon vos besoins.</p>
<p>⚠️ Utilisez des plats adaptés à la cuisson au four.</p>
<p>🧤 Attention aux surfaces et aux plats chauds.</p>
<p>🧽 Merci de laisser le four propre après utilisation.</p>
`
},

dishwasher:{
 name:"Lave-vaisselle",
 text:`
<p>🍽️ Retirez les gros résidus alimentaires avant de charger la vaisselle.</p>
<p>🧴 Utilisez uniquement un produit prévu pour lave-vaisselle.</p>
<p>⚠️ N'utilisez jamais de liquide vaisselle classique dans la machine.</p>
<p>✨ Merci de vider la vaisselle propre lorsque le cycle est terminé.</p>
`
},

gas:{
 name:"Plaque 4 feux gaz",
 text:`
<p>🔥 Vérifiez l'allumage de la flamme après avoir ouvert le brûleur.</p>
<p>⚠️ Ne laissez jamais une cuisson sans surveillance.</p>
<p>🔴 Après utilisation, vérifiez que tous les boutons sont bien en position arrêt.</p>
`
},

toaster:{
 name:"Grille-pain",
 text:`
<p>🍞 Utilisez le grille-pain uniquement pour du pain ou des produits adaptés.</p>
<p>⚠️ N'introduisez jamais d'objet métallique dans l'appareil.</p>
<p>🧹 Merci de retirer régulièrement les miettes.</p>
`
}

},


en: {

pageTitle:"Kitchen",

headerText:
"Find useful information about the kitchen appliances available during your stay.",

intro:
"👆 Select an appliance to view the main instructions.",

home:
"← Back to the guest guide",

open:"View instructions",

coffee:{name:"Senseo coffee machine"},
microwave:{name:"Microwave oven"},
fridge:{name:"Refrigerator"},
kettle:{name:"Electric kettle"},
oven:{name:"Multifunction oven"},
dishwasher:{name:"Dishwasher"},
gas:{name:"4-burner gas hob"},
toaster:{name:"Toaster"}

},


de: {

pageTitle:"Küche",

headerText:
"Hier finden Sie nützliche Informationen zu den Küchengeräten.",

intro:
"👆 Wählen Sie ein Gerät aus, um die wichtigsten Hinweise anzuzeigen.",

home:
"← Zurück zum Gästeführer",

open:"Hinweise anzeigen",

coffee:{name:"Senseo-Kaffeemaschine"},
microwave:{name:"Mikrowelle"},
fridge:{name:"Kühlschrank"},
kettle:{name:"Wasserkocher"},
oven:{name:"Multifunktionsbackofen"},
dishwasher:{name:"Geschirrspüler"},
gas:{name:"4-Flammen-Gaskochfeld"},
toaster:{name:"Toaster"}

},


nl: {

pageTitle:"Keuken",

headerText:
"Hier vindt u nuttige informatie over de keukenapparatuur.",

intro:
"👆 Selecteer een apparaat om de belangrijkste instructies te bekijken.",

home:
"← Terug naar de gastenhandleiding",

open:"Instructies bekijken",

coffee:{name:"Senseo-koffiezetapparaat"},
microwave:{name:"Magnetron"},
fridge:{name:"Koelkast"},
kettle:{name:"Waterkoker"},
oven:{name:"Multifunctionele oven"},
dishwasher:{name:"Vaatwasser"},
gas:{name:"4-pits gaskookplaat"},
toaster:{name:"Broodrooster"}

}

};


let currentLanguage = "fr";


/* ============================
   AFFICHAGE
============================ */

function renderAppliances() {

const container =
document.getElementById("appliances");

container.innerHTML = "";

const t =
translations[currentLanguage];


appliances.forEach((appliance,index) => {

const card =
document.createElement("div");

card.className =
"appliance";


let translated =
t[appliance.type];


let name =
translated.name;


/*
Pour EN / DE / NL, on utilise provisoirement
les consignes françaises si aucune traduction
détaillée n'est encore définie.
*/

let instructions =

translated.text ||

translations.fr[appliance.type].text;


card.innerHTML = `

<div class="appliance-header"
onclick="toggleAppliance(${index})">

<div class="icon">
${appliance.icon}
</div>

<div class="appliance-info">

<h2>
${name}
</h2>

${appliance.reference ?
`<div class="reference">${appliance.reference}</div>`
: ""}

</div>

<div class="arrow">
⌄
</div>

</div>


<div class="instructions">

${instructions}

</div>

`;


card.id =
"appliance-" + index;


container.appendChild(card);

});

}


function toggleAppliance(index) {

const selected =
document.getElementById(
"appliance-" + index
);


const wasOpen =
selected.classList.contains("open");


document
.querySelectorAll(".appliance")
.forEach(card => {

card.classList.remove("open");

});


if (!wasOpen) {

selected.classList.add("open");

}

}


/* ============================
   LANGUES
============================ */

function changeLanguage(lang) {

currentLanguage = lang;

localStorage.setItem(
"language",
lang
);

document.documentElement.lang =
lang;


const t =
translations[lang];


document.getElementById("pageTitle").textContent =
t.pageTitle;

document.getElementById("headerText").textContent =
t.headerText;

document.getElementById("intro").textContent =
t.intro;

document.getElementById("homeButton").textContent =
t.home;


renderAppliances();

}


/* ============================
   LANGUE AUTOMATIQUE
============================ */

let savedLanguage =
localStorage.getItem("language");


if (
savedLanguage &&
translations[savedLanguage]
) {

changeLanguage(savedLanguage);

}

else {

let browserLanguage =
navigator.language ||
navigator.userLanguage ||
"fr";


browserLanguage =
browserLanguage
.substring(0,2)
.toLowerCase();


if (
!["fr","en","de","nl"]
.includes(browserLanguage)
) {

browserLanguage = "en";

}


changeLanguage(browserLanguage);

}

</script>

</body>
</html>
