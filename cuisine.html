let currentLanguage = "fr";


/* ============================
   AFFICHAGE
============================ */

function renderAppliances() {

const container =
document.getElementById("appliances");

container.innerHTML = "";

const t =
translations[currentLanguage];


appliances.forEach((appliance,index) => {

const card =
document.createElement("div");

card.className =
"appliance";


let translated =
t[appliance.type];


let name =
translated.name;

let instructions =
translated.text ||
translations.fr[appliance.type].text;


card.innerHTML = `

<div class="appliance-header"
onclick="toggleAppliance(${index})">

<div class="icon">
${appliance.icon}
</div>

<div class="appliance-info">

<h2>
${name}
</h2>

${appliance.reference ?
`<div class="reference">${appliance.reference}</div>`
: ""}

</div>

<div class="arrow">
⌄
</div>

</div>


<div class="instructions">

${instructions}

</div>

`;


card.id =
"appliance-" + index;


container.appendChild(card);

});

}


function toggleAppliance(index) {

const selected =
document.getElementById(
"appliance-" + index
);


const wasOpen =
selected.classList.contains("open");


document
.querySelectorAll(".appliance")
.forEach(card => {

card.classList.remove("open");

});


if (!wasOpen) {

selected.classList.add("open");

}

}


/* ============================
   LANGUES
============================ */

function changeLanguage(lang) {

currentLanguage = lang;

localStorage.setItem(
"language",
lang
);

document.documentElement.lang =
lang;


const t =
translations[lang];


document.getElementById("pageTitle").textContent =
t.pageTitle;

document.getElementById("headerText").textContent =
t.headerText;

document.getElementById("intro").textContent =
t.intro;

document.getElementById("homeButton").textContent =
t.home;


renderAppliances();

}


/* ============================
   LANGUE AUTOMATIQUE
============================ */

let savedLanguage =
localStorage.getItem("language");


if (
savedLanguage &&
translations[savedLanguage]
) {

changeLanguage(savedLanguage);

}

else {

let browserLanguage =
navigator.language ||
navigator.userLanguage ||
"fr";


browserLanguage =
browserLanguage
.substring(0,2)
.toLowerCase();


if (
!["fr","en","de","nl"]
.includes(browserLanguage)
) {

browserLanguage = "en";

}


changeLanguage(browserLanguage);

}
