<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Arrivée & Départ - Le Refuge des Étoiles</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f2ed;
      color: #2f2f2f;
    }

    header {
      background: linear-gradient(135deg, #2f4f3f, #6f8f78);
      color: white;
      text-align: center;
      padding: 35px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    .language-selector {
      margin-top: 18px;
    }

    .language-selector button {
      border: none;
      background: white;
      padding: 9px 12px;
      margin: 3px;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
    }

    h2 {
      color: #3f6651;
      text-align: center;
    }

    iframe {
      width: 100%;
      height: 75vh;
      border: none;
      border-radius: 12px;
    }

    .button {
      display: block;
      width: fit-content;
      margin: 20px auto 0;
      padding: 13px 20px;
      background: #3f6651;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 25px 20px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <h1>🔑 <span id="pageTitle">Arrivée & Départ</span></h1>

  <div class="language-selector">
    <button onclick="changeLanguage('fr')">🇫🇷</button>
    <button onclick="changeLanguage('en')">🇬🇧</button>
    <button onclick="changeLanguage('de')">🇩🇪</button>
    <button onclick="changeLanguage('nl')">🇳🇱</button>
  </div>
</header>

<div class="container">

  <div class="card">

    <h2 id="title">Informations d'arrivée et de départ</h2>

    <img id="documentViewer"
     src="arrivee-fr.jpg"
     style="
       width:100%;
       height:auto;
       border-radius:12px;
       display:block;
     ">

    <a id="pdfButton"
       class="button"
       href="arrivee-fr.pdf"
       target="_blank">
      📄 Ouvrir en plein écran
    </a>

  </div>

  <a class="button" href="index.html" id="homeButton">
    ← Retour au livret d'accueil
  </a>

</div>

<footer>
  ✨ Le Refuge des Étoiles ✨<br>
  Le Sappey — Haute-Savoie
</footer>

<script>

const translations = {

  fr: {
    pageTitle: "Arrivée & Départ",
    title: "Informations d'arrivée et de départ",
    image: "arrivee-fr.jpg",
    pdf: "arrivee-fr.pdf",
    open: "📄 Ouvrir en plein écran",
    home: "← Retour au livret d'accueil"
  },

  en: {
    pageTitle: "Arrival & Departure",
    title: "Arrival and departure information",
    image: "arrivee-en.jpg",
    pdf: "arrivee-en.pdf",
    open: "📄 Open full screen",
    home: "← Back to the guest guide"
  },

  de: {
    pageTitle: "Ankunft & Abreise",
    title: "Informationen zu Ankunft und Abreise",
    image: "arrivee-de.jpg",
    pdf: "arrivee-de.pdf",
    open: "📄 Im Vollbild öffnen",
    home: "← Zurück zum Gästeführer"
  },

  nl: {
    pageTitle: "Aankomst & Vertrek",
    title: "Informatie over aankomst en vertrek",
    image: "arrivee-nl.jpg",
    pdf: "arrivee-nl.pdf",
    open: "📄 Volledig scherm openen",
    home: "← Terug naar de gastenhandleiding"
  }

};


function changeLanguage(lang) {

  localStorage.setItem("language", lang);

  document.documentElement.lang = lang;

  document.getElementById("pageTitle").textContent =
    translations[lang].pageTitle;

  document.getElementById("title").textContent =
    translations[lang].title;

  document.getElementById("documentViewer").src =
  translations[lang].image;

  document.getElementById("pdfButton").href =
    translations[lang].pdf;

  document.getElementById("pdfButton").textContent =
    translations[lang].open;

  document.getElementById("homeButton").textContent =
    translations[lang].home;
}


let savedLanguage = localStorage.getItem("language");

if (savedLanguage && translations[savedLanguage]) {

  changeLanguage(savedLanguage);

} else {

  let browserLanguage =
    navigator.language ||
    navigator.userLanguage ||
    "fr";

  browserLanguage =
    browserLanguage.substring(0,2).toLowerCase();

  if (!["fr","en","de","nl"].includes(browserLanguage)) {
    browserLanguage = "en";
  }

  changeLanguage(browserLanguage);

}

</script>

</body>
</html>
