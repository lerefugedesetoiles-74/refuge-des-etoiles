header {

.container {

/* FILTRES */

.filters {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;

.filter-button {
  border: none;
  background: white;

  font-weight: bold;
}

.filter-button.active {
  background: #415d73;

/* CARTES */

.place-card {
  background: white;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.07);
}

.place-header {
  display: flex;
  gap: 15px;
  align-items: flex-start;
}

.place-icon {
  min-width: 58px;
  height: 58px;
  border-radius: 50%;
  background: #eaf0f4;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
}

.place-info {
  flex: 1;
}

.place-card h2 {
  color: #415d73;
  margin: 0 0 7px 0;
  font-size: 21px;
}

.description {
  line-height: 1.5;
  margin-bottom: 7px;
  color: #555;
}

.address,
.phone {
  line-height: 1.5;
  margin: 4px 0;
}


/* BOUTONS */

.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-top: 15px;
}

.action-button {
  display: block;
  text-align: center;
  padding: 12px 8px;
  border-radius: 9px;
  text-decoration: none;
  font-weight: bold;
}

.map-button {
  background: #415d73;
  color: white;
}

.website-button {
  background: #e8eef2;
  color: #415d73;
}

.back-button {
  display: block;
  width: fit-content;
  margin: 25px auto 10px;
  padding: 13px 20px;
  background: #415d73;
  color: white;
  text-decoration: none;
  border-radius: 10px;
  font-weight: bold;
}

.home-button {
  display: block;
  width: fit-content;
  margin: 10px auto 25px;
  padding: 11px 18px;
  background: #777;
  color: white;
  text-decoration: none;
  border-radius: 10px;
  font-weight: bold;
}

footer {
  text-align: center;
  padding: 25px 20px;
  color: #777;
  font-size: 14px;
}

@media (max-width:600px) {

  .container {
    padding: 12px;
  }

  .place-card {
    padding: 16px;
  }

  .buttons {
    grid-template-columns: 1fr;
  }

}

let currentLanguage = "fr";


/* ==================================
   AFFICHAGE DES CARTES
================================== */

function renderPlaces(filter = "all") {

  const container =
  document.getElementById("placesContainer");

  container.innerHTML = "";

  const t =
  translations[currentLanguage];


  places.forEach(place => {


    if (
      filter !== "all" &&
      place.category !== filter
    ) {
      return;
    }


    const card =
    document.createElement("div");

    card.className =
    "place-card";


    const mapsUrl =

    "https://www.google.com/maps/search/?api=1&query=" +

    encodeURIComponent(place.query);


    let addressHtml = "";


    if (place.address) {

      addressHtml = `

      <div class="address">

      📍 ${place.address}

      </div>

      `;

    }


    let phoneHtml = "";


    if (place.phone) {

      phoneHtml = `

      <div class="phone">

      ☎️

      <a href="tel:${place.phone.replace(/\s/g,'')}">

      ${place.phone}

      </a>

      </div>

      `;

    }


    let websiteButtons = "";


    if (place.website) {

      websiteButtons = `

      <a
      class="action-button website-button"
      href="${place.website}"
      target="_blank">

      ${t.website}

      </a>

      `;

    }


    if (place.websites) {

      websiteButtons = `

      <a
      class="action-button website-button"
      href="${place.websites[0]}"
      target="_blank">

      ${t.website1}

      </a>

      <a
      class="action-button website-button"
      href="${place.websites[1]}"
      target="_blank">

      ${t.website2}

      </a>

      `;

    }


    card.innerHTML = `

    <div class="place-header">

      <div class="place-icon">
      ${place.icon}
      </div>


      <div class="place-info">

        <h2>
        ${place.name}
        </h2>


        <div class="description">

        ${place.descriptions[currentLanguage]}

        </div>


        ${addressHtml}

        ${phoneHtml}

      </div>

    </div>


    <div class="buttons">

      <a
      class="action-button map-button"
      href="${mapsUrl}"
      target="_blank">

      ${t.map}

      </a>


      ${websiteButtons}

    </div>

    `;


    container.appendChild(card);

  });

}


/* ==================================
   FILTRES
================================== */

function filterPlaces(filter, button) {

  document
  .querySelectorAll(".filter-button")
  .forEach(btn => {

    btn.classList.remove("active");

  });


  button.classList.add("active");


  renderPlaces(filter);

}


/* ==================================
   LANGUE
================================== */

function changeLanguage(lang) {

  currentLanguage = lang;


  localStorage.setItem(
  "language",
  lang
  );


  document.documentElement.lang =
  lang;


  const t =
  translations[lang];


  document.getElementById("pageTitle").textContent =
  t.pageTitle;


  document.getElementById("headerText").textContent =
  t.headerText;


  document.getElementById("filterAll").textContent =
  t.filterAll;


  document.getElementById("filterTown").textContent =
  t.filterTown;


  document.getElementById("filterMountain").textContent =
  t.filterMountain;


  document.getElementById("filterHeritage").textContent =
  t.filterHeritage;


  document.getElementById("backButton").textContent =
  t.back;


  document.getElementById("homeButton").textContent =
  t.home;


  renderPlaces();

}


/* ==================================
   LANGUE AUTOMATIQUE
================================== */

let savedLanguage =
localStorage.getItem("language");


if (
savedLanguage &&
translations[savedLanguage]
) {

  changeLanguage(savedLanguage);

}

else {


  let browserLanguage =

  navigator.language ||

  navigator.userLanguage ||

  "fr";


  browserLanguage =

  browserLanguage
  .substring(0,2)
  .toLowerCase();


  if (
  !["fr","en","de","nl"]
  .includes(browserLanguage)
  ) {

    browserLanguage = "en";

  }


  changeLanguage(browserLanguage);

}
