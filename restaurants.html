nl: {

  filterAll: "Alles",
  filterNearby: "🍽️ In de buurt",
  filterFast: "🍕 Snelle maaltijd",
  filterSavoy: "🧀 Savoyaardse specialiteiten",
  map: "📍 Route",
  back: "← Terug naar uitstapjes",
  home: "🏡 Gastenhandleiding"
}

};

let currentLanguage = "fr";

function renderPlaces(filter = "all") {

  const container =
  document.getElementById("placesContainer");

  container.innerHTML = "";

  const t =
  translations[currentLanguage];

  places.forEach(place => {

    if (
      filter !== "all" &&
      place.category !== filter
    ) {
      return;
    }

    const card =
    document.createElement("div");

    card.className =
    "place-card";

    const mapsUrl =
    "https://www.google.com/maps/search/?api=1&query=" +
    encodeURIComponent(place.address);

    card.innerHTML = `

    <div class="place-header">

      <div class="place-icon">
        ${place.icon}
      </div>

      <div class="place-info">

        <h2>${place.name}</h2>

        <div class="description">
          ${place.descriptions[currentLanguage]}
        </div>

        <div class="address">
          📍 ${place.address}
        </div>

        <div class="phone">
          ☎️
          <a href="tel:${place.phone.replace(/\s/g,'')}">
            ${place.phone}
          </a>
        </div>

        <div class="price">
          ${place.price}
        </div>

      </div>

    </div>

    <div class="buttons">

      <a
      class="action-button map-button"
      href="${mapsUrl}"
      target="_blank">

        ${t.map}

      </a>

    </div>

    `;

    container.appendChild(card);

  });

}

function filterPlaces(filter, button) {

  document
  .querySelectorAll(".filter-button")
  .forEach(btn => {
    btn.classList.remove("active");
  });

  button.classList.add("active");

  renderPlaces(filter);

}

function changeLanguage(lang) {

  currentLanguage = lang;

  localStorage.setItem(
  "language",
  lang
  );

  document.documentElement.lang =
  lang;

  const t =
  translations[lang];

  document.getElementById("pageTitle").textContent =
  t.pageTitle;

  document.getElementById("headerText").textContent =
  t.headerText;

  document.getElementById("filterAll").textContent =
  t.filterAll;

  document.getElementById("filterNearby").textContent =
  t.filterNearby;

  document.getElementById("filterFast").textContent =
  t.filterFast;

  document.getElementById("filterSavoy").textContent =
  t.filterSavoy;

  document.getElementById("backButton").textContent =
  t.back;

  document.getElementById("homeButton").textContent =
  t.home;

  renderPlaces();

}

let savedLanguage =
localStorage.getItem("language");

if (
savedLanguage &&
translations[savedLanguage]
) {

  changeLanguage(savedLanguage);

} else {

  let browserLanguage =
  navigator.language ||
  navigator.userLanguage ||
  "fr";

  browserLanguage =
  browserLanguage.substring(0,2).toLowerCase();

  if (
  !["fr","en","de","nl"].includes(browserLanguage)
  ) {
    browserLanguage = "en";
  }

  changeLanguage(browserLanguage);

}
