<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Animaux - Le Refuge des Étoiles</title>

<style>

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f2ed;
  color: #2f2f2f;
}

header {
  background: linear-gradient(135deg, #5f7047, #9aaa73);
  color: white;
  text-align: center;
  padding: 35px 20px;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

header p {
  max-width: 650px;
  margin: 12px auto 0;
  line-height: 1.5;
}

.language-selector {
  margin-top: 18px;
}

.language-selector button {
  border: none;
  background: white;
  padding: 9px 12px;
  margin: 3px;
  border-radius: 8px;
  font-size: 18px;
  cursor: pointer;
}

.container {
  max-width: 850px;
  margin: auto;
  padding: 20px;
}

.filters {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  margin-bottom: 20px;
}

.filter-button {
  border: none;
  background: white;
  padding: 10px 14px;
  border-radius: 20px;
  cursor: pointer;
  box-shadow: 0 2px 7px rgba(0,0,0,0.08);
  font-weight: bold;
}

.filter-button.active {
  background: #5f7047;
  color: white;
}

.place-card {
  background: white;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.07);
}

.place-header {
  display: flex;
  gap: 15px;
  align-items: flex-start;
}

.place-icon {
  min-width: 58px;
  height: 58px;
  border-radius: 50%;
  background: #eef2e7;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
}

.place-info {
  flex: 1;
}

.place-card h2 {
  color: #5f7047;
  margin: 0 0 8px 0;
  font-size: 21px;
}

.travel {
  font-weight: bold;
  margin-bottom: 8px;
}

.address,
.phone {
  line-height: 1.5;
  margin: 4px 0;
}

.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-top: 15px;
}

.action-button {
  display: block;
  text-align: center;
  padding: 12px 8px;
  border-radius: 9px;
  text-decoration: none;
  font-weight: bold;
}

.map-button {
  background: #5f7047;
  color: white;
}

.website-button {
  background: #edf1e7;
  color: #5f7047;
}

.back-button {
  display: block;
  width: fit-content;
  margin: 25px auto 10px;
  padding: 13px 20px;
  background: #5f7047;
  color: white;
  text-decoration: none;
  border-radius: 10px;
  font-weight: bold;
  text-align: center;
}

.home-button {
  display: block;
  width: fit-content;
  margin: 10px auto 25px;
  padding: 11px 18px;
  background: #777;
  color: white;
  text-decoration: none;
  border-radius: 10px;
  font-weight: bold;
}

footer {
  text-align: center;
  padding: 25px 20px;
  color: #777;
  font-size: 14px;
}

@media (max-width: 600px) {

  .container {
    padding: 12px;
  }

  .place-card {
    padding: 16px;
  }

  .buttons {
    grid-template-columns: 1fr;
  }

}

</style>
</head>


<body>

<header>

<h1>🦅 <span id="pageTitle">Animaux</span></h1>

<p id="headerText">
Fermes, parcs animaliers et découvertes autour des animaux.
</p>

<div class="language-selector">
  <button onclick="changeLanguage('fr')">🇫🇷</button>
  <button onclick="changeLanguage('en')">🇬🇧</button>
  <button onclick="changeLanguage('de')">🇩🇪</button>
  <button onclick="changeLanguage('nl')">🇳🇱</button>
</div>

</header>


<div class="container">

<div class="filters">

<button
class="filter-button active"
id="filterAll"
onclick="filterPlaces('all', this)">
Tous
</button>

<button
class="filter-button"
id="filterNear"
onclick="filterPlaces('near', this)">
📍 Moins de 30 min
</button>

<button
class="filter-button"
id="filterClose"
onclick="filterPlaces('verynear', this)">
🚗 Moins de 20 km
</button>

</div>


<div id="placesContainer"></div>


<a
class="back-button"
href="sorties.html"
id="backButton">
← Retour aux sorties
</a>

<a
class="home-button"
href="index.html"
id="homeButton">
🏡 Accueil du livret
</a>

</div>


<footer>
✨ Le Refuge des Étoiles ✨<br>
Le Sappey — Haute-Savoie
</footer>


<script>

/* =============================
   LIEUX
============================= */

const places = [

{

  km: 6,
  minutes: 10,

  phone: "+33 (0)4 50 32 10 33",
  website: "https://www.cruseilles.fr/decouvrir/2921"
},

{
  name: "La ferme de Chosal",
  icon: "🐴",
  km: 12,
  minutes: 20,
  timeText: "20 min",
  address: "98 Route de l’Usine, Chosal, 74350 Copponex",
  phone: "+33 (0)4 50 44 12 82",
  website: "https://fermedechosal.org/"
},

{
  name: "Tropicaland",
  icon: "🦎",
  km: 27,
  minutes: 30,
  timeText: "30 min",
  address: "50 Chemin de Cortenet, 74580 Viry",
  phone: "+33 (0)6 09 70 13 16",
  website: "https://www.tropicaland.fr/"
},

{
  name: "Volière de l’Impérial",
  icon: "🦚",
  km: 27,
  minutes: 35,
  timeText: "35 min",
  address: "Parc Charles Bosson, 74000 Annecy",
  phone: "+33 (0)4 50 33 88 88",
  website: "https://www.annecy.fr/356-parc-animalier-et-voliere.htm#document"
},

{
  name: "Parc du Bois de la Bâtie – Suisse",
  icon: "🐗",
  km: 31,
  minutes: 30,
  timeText: "30 min",
  address: "4 Chemin de la Bâtie, 1213 Petit-Lancy, Suisse",
  phone: "+41 22 418 48 90",
  website: "https://www.geneve.ch/bois-batie"
},

{
  name: "Parc Animalier de la Grande Jeanne",
  icon: "🦌",
  km: 33,
  minutes: 40,
  timeText: "40 min",
  address: "14 Route Semnoz, 74000 Annecy",
  phone: "+33 (0)4 50 33 88 88",
  website: "https://www.petitedecouverte.fr/parcanimalier-lagrandejeanne/"
},

{
  name: "Les Aigles du Léman",
  icon: "🦅",
  km: 52,
  minutes: 60,
  timeText: "1 h",
  address: "Route du Moulin de la Glacière, Domaine du Guidou, 74140 Sciez-sur-Léman",
  phone: "+33 (0)4 50 72 72 26",
  website: "https://www.lesaiglesduleman.com/"
},

{
  name: "Parc de Merlet",
  icon: "🦌",
  km: 84,
  minutes: 60,
  timeText: "1 h",
  address: "2495 Chemin de Merlet, 74310 Les Houches",
  phone: "+33 (0)7 67 22 82 69",
  website: "https://www.parcdemerlet.com/"
},

{
  name: "Les Lindarets",
  icon: "🐐",
  km: 85,
  minutes: 100,
  timeText: "1 h 40",
  address: "Les Lindarets, 74110 Montriond",
  phone: "",
  website: "https://www.valleedaulps.com/explorer/incontournables/les-lindarets-village-des-chevres/"
},

{
  name: "Parc des Oiseaux",
  icon: "🦜",
  km: 131,
  minutes: 105,
  timeText: "1 h 45",
  address: "Route Départementale 1083, 01330 Villars-les-Dombes",
  phone: "+33 (0)4 50 73 50 08",
  website: "https://www.parcdesoiseaux.com/"
}

];


/* =============================
   TRADUCTIONS
============================= */

const translations = {

fr: {

pageTitle:
"Animaux",

headerText:
"Fermes, parcs animaliers et découvertes autour des animaux.",

filterAll:
"Tous",

filterNear:
"📍 Moins de 30 min",

filterClose:
"🚗 Moins de 20 km",

travel:
"environ",

map:
"📍 Itinéraire",

website:
"🌐 Site internet",

back:
"← Retour aux sorties",

home:
"🏡 Accueil du livret"

},


en: {

pageTitle:
"Animals",

headerText:
"Farms, wildlife parks and animal-related activities.",

filterAll:
"All",

filterNear:
"📍 Less than 30 min",

filterClose:
"🚗 Less than 20 km",

travel:
"about",

map:
"📍 Directions",

website:
"🌐 Website",

back:
"← Back to activities",

home:
"🏡 Guest guide home"

},


de: {

pageTitle:
"Tiere",

headerText:
"Bauernhöfe, Tierparks und Ausflugsziele rund um Tiere.",

filterAll:
"Alle",

filterNear:
"📍 Unter 30 Min.",

filterClose:
"🚗 Unter 20 km",

travel:
"ca.",

map:
"📍 Route",

website:
"🌐 Webseite",

back:
"← Zurück zu den Ausflügen",

home:
"🏡 Gästeführer"

},


nl: {

pageTitle:
"Dieren",

headerText:
"Boerderijen, dierenparken en activiteiten rond dieren.",

filterAll:
"Alles",

filterNear:
"📍 Minder dan 30 min",

filterClose:
"🚗 Minder dan 20 km",

travel:
"ongeveer",

map:
"📍 Route",

website:
"🌐 Website",

back:
"← Terug naar uitstapjes",

home:
"🏡 Gastenhandleiding"

}

};


let currentLanguage = "fr";


/* =============================
   AFFICHAGE DES LIEUX
============================= */

function renderPlaces(filter = "all") {

const container =
document.getElementById("placesContainer");

container.innerHTML = "";

const t =
translations[currentLanguage];


places.forEach(place => {


if (
filter === "near" &&
place.minutes >= 30
) {
return;
}


if (
filter === "verynear" &&
place.km >= 20
) {
return;
}


const card =
document.createElement("div");

card.className =
"place-card";


const mapsUrl =

"https://www.google.com/maps/search/?api=1&query=" +

encodeURIComponent(place.address);


let phoneHtml = "";


if (place.phone) {

phoneHtml = `

<div class="phone">

☎️

<a href="tel:${place.phone.replace(/\s/g,'')}">

${place.phone}

</a>

</div>

`;

}


let websiteButton = "";


if (place.website) {

websiteButton = `

<a
class="action-button website-button"
href="${place.website}"
target="_blank">

${t.website}

</a>

`;

}


card.innerHTML = `

<div class="place-header">

<div class="place-icon">
${place.icon}
</div>


<div class="place-info">

<h2>
${place.name}
</h2>


<div class="travel">

🚗 ${place.km} km
•
${t.travel} ${place.timeText}

</div>


<div class="address">

📍 ${place.address}

</div>


${phoneHtml}

</div>

</div>


<div class="buttons">

<a
class="action-button map-button"
href="${mapsUrl}"
target="_blank">

${t.map}

</a>

${websiteButton}

</div>

`;


container.appendChild(card);

});

}


/* =============================
   FILTRES
============================= */

function filterPlaces(filter, button) {

document
.querySelectorAll(".filter-button")
.forEach(btn => {

btn.classList.remove("active");

});


button.classList.add("active");


renderPlaces(filter);

}


/* =============================
   LANGUE
============================= */

function changeLanguage(lang) {

currentLanguage = lang;


localStorage.setItem(
"language",
lang
);


document.documentElement.lang =
lang;


const t =
translations[lang];


document.getElementById("pageTitle").textContent =
t.pageTitle;


document.getElementById("headerText").textContent =
t.headerText;


document.getElementById("filterAll").textContent =
t.filterAll;


document.getElementById("filterNear").textContent =
t.filterNear;


document.getElementById("filterClose").textContent =
t.filterClose;


document.getElementById("backButton").textContent =
t.back;


document.getElementById("homeButton").textContent =
t.home;


renderPlaces();

}


/* =============================
   LANGUE AUTOMATIQUE
============================= */

let savedLanguage =
localStorage.getItem("language");


if (
savedLanguage &&
translations[savedLanguage]
) {

changeLanguage(savedLanguage);

}

else {

let browserLanguage =

navigator.language ||

navigator.userLanguage ||

"fr";


browserLanguage =

browserLanguage
.substring(0,2)
.toLowerCase();


if (
!["fr","en","de","nl"]
.includes(browserLanguage)
) {

browserLanguage = "en";

}


changeLanguage(browserLanguage);

}

</script>

</body>
</html>
